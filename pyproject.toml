[project]
name = "calculadora"
version = "0.1.0"
description = "Calculadora de matrices con interfaz de línea de comandos y entrada JSON"
authors = [
    { name = "Alejandro Arce" },
    { name = "Steven Fonseca" },
    { name = "Brayan Solis" },
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.1",
]

[project.scripts]
calculadora = "calculadora:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
